[pytest]
# Lives beside alembic.ini so that `cd backend && pytest` works from the
# same rootdir the rest of the backend tooling uses.
pythonpath = .
testpaths = tests
# The suite uses explicit @pytest.mark.asyncio markers, so strict mode is
# correct here; auto mode would also try to collect sync fixtures as async.
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function
python_files = test_*.py
addopts = -q --strict-markers
filterwarnings =
    ignore::DeprecationWarning
