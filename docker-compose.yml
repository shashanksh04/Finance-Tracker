services:
  db:
    image: pgvector/pgvector:pg16
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: finance_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: finance_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance_user -d finance_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  app:
    build: .
    ports:
      - "80:80"
    volumes:
      - uploads:/var/www/finance-tracker/uploads
    environment:
      DATABASE_URL: postgresql+asyncpg://finance_user:${DB_PASSWORD}@db:5432/finance_db
      DATABASE_URL_SYNC: postgresql+psycopg2://finance_user:${DB_PASSWORD}@db:5432/finance_db
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/2
      SECRET_KEY: ${SECRET_KEY}
      CORS_ORIGINS: https://finance.shashankakumar.com,https://neha.shashankakumar.com,http://localhost:5173,http://localhost:8081
      OLLAMA_BASE_URL: https://ollama.com
      OLLAMA_MODEL: gpt-oss:120b-cloud
      OLLAMA_API_KEY: ${OLLAMA_API_KEY}
      UPLOAD_DIR: /var/www/finance-tracker/uploads
      LOG_LEVEL: INFO
      EMBEDDING_MODEL: mxbai-embed-large
      EMBEDDING_DIMENSION: 1024
      CONVERSATION_TTL_HOURS: 24
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:80/health || curl -f http://127.0.0.1:80/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
